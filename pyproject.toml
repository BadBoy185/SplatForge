[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splatforge"
version = "0.1.0"
description = "Extensible local-first pipeline for 3D Gaussian Splatting reconstruction workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=11,<13",
    "pydantic>=2.9,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
]

[project.scripts]
splatforge = "splatforge.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
